<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DJI Video Compressor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }

    button, input, select, .drop-zone, .settings-panel { -webkit-app-region: no-drag; }

    .header {
      padding: 48px 32px 12px;
      text-align: center;
    }

    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .header p { font-size: 12px; color: #666; margin-top: 4px; }

    .content {
      flex: 1;
      padding: 12px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* Drop zone */
    .drop-zone {
      min-height: 140px;
      border: 2px dashed #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
    }

    .drop-zone .icon { font-size: 32px; opacity: 0.3; }
    .drop-zone .label { font-size: 13px; color: #666; }
    .drop-zone .sublabel { font-size: 11px; color: #444; }

    /* Folder info */
    .folder-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .folder-info .name { font-size: 13px; font-weight: 500; }
    .folder-info .meta { font-size: 11px; color: #666; margin-top: 2px; }

    .folder-info .change-btn {
      font-size: 11px; color: #666; background: none;
      border: 1px solid #333; border-radius: 6px;
      padding: 4px 10px; cursor: pointer; transition: all 0.15s;
    }
    .folder-info .change-btn:hover { color: #e5e5e5; border-color: #555; }

    /* Settings panel */
    .settings-panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .settings-header h3 { font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setting-group { display: flex; flex-direction: column; gap: 4px; }
    .setting-group.full { grid-column: 1 / -1; }
    .setting-group label { font-size: 11px; color: #555; font-weight: 500; }

    .setting-group select, .setting-group input[type="range"] {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .setting-group select:hover, .setting-group select:focus { border-color: #555; }

    .quality-row { display: flex; align-items: center; gap: 8px; }

    .quality-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #333;
      border-radius: 2px;
      border: none !important;
      padding: 0 !important;
    }

    .quality-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }

    .quality-value {
      font-size: 12px;
      font-weight: 600;
      color: #3b82f6;
      min-width: 24px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .quality-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #444;
      margin-top: 2px;
    }

    .preset-pills {
      display: flex;
      gap: 4px;
    }

    .preset-pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: none;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-pill:hover { color: #ccc; border-color: #555; }
    .preset-pill.active { background: #3b82f6; color: white; border-color: #3b82f6; }

    /* Compress button */
    .compress-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #3b82f6;
      color: white;
    }
    .compress-btn:hover { background: #2563eb; }
    .compress-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Progress */
    .progress-area { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #3b82f6;
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
    }

    .current-file {
      font-size: 12px;
      color: #999;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Done */
    .done-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .done-area .checkmark { font-size: 44px; }
    .done-area .message { font-size: 14px; font-weight: 500; }
    .done-area .sub { font-size: 12px; color: #666; text-align: center; }

    .reset-btn {
      padding: 8px 24px;
      border-radius: 8px;
      border: 1px solid #333;
      background: none;
      color: #999;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 4px;
    }
    .reset-btn:hover { color: #e5e5e5; border-color: #555; }

    .metadata-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 4px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DJI Video Compressor</h1>
    <p>Compress videos while preserving GPS metadata</p>
  </div>

  <div class="content">
    <!-- State: waiting for folder -->
    <div id="drop-state" class="drop-zone" onclick="selectFolder()">
      <div class="icon">&#128193;</div>
      <div class="label">Drop a flight folder here</div>
      <div class="sublabel">or click to browse</div>
    </div>

    <!-- State: folder selected + settings -->
    <div id="selected-state" style="display:none">
      <div class="folder-info">
        <div>
          <div class="name" id="folder-name"></div>
          <div class="meta" id="folder-meta"></div>
        </div>
        <button class="change-btn" onclick="reset()">Change</button>
      </div>

      <div class="settings-panel" style="margin-top: 12px">
        <div class="settings-header">
          <h3>Encoding Settings</h3>
        </div>

        <div class="settings-grid">
          <!-- Codec -->
          <div class="setting-group">
            <label>Video Codec</label>
            <select id="set-codec" onchange="updateSettings()">
              <option value="h265">H.265 (HEVC) — Smaller</option>
              <option value="h264">H.264 (AVC) — Compatible</option>
            </select>
          </div>

          <!-- Encoder -->
          <div class="setting-group">
            <label>Encoder</label>
            <select id="set-encoder" onchange="updateSettings()">
              <option value="hardware">Hardware (VideoToolbox) — Fast</option>
              <option value="software">Software (CPU) — Slower</option>
            </select>
          </div>

          <!-- Quality -->
          <div class="setting-group full">
            <label>Quality (CRF) &nbsp;&mdash;&nbsp; <span id="quality-label">22 (Good)</span></label>
            <div class="quality-row">
              <input type="range" id="set-quality" class="quality-slider" min="0" max="51" value="22" oninput="updateQuality()">
              <span class="quality-value" id="quality-value">22</span>
            </div>
            <div class="quality-labels">
              <span>&#8592; Larger / Better</span>
              <span>Smaller / Worse &#8594;</span>
            </div>
          </div>

          <!-- Preset (software only) -->
          <div class="setting-group full" id="preset-group">
            <label>Speed Preset</label>
            <div class="preset-pills" id="preset-pills">
              <button class="preset-pill" data-val="ultrafast" onclick="setPreset(this)">Ultrafast</button>
              <button class="preset-pill" data-val="fast" onclick="setPreset(this)">Fast</button>
              <button class="preset-pill active" data-val="medium" onclick="setPreset(this)">Medium</button>
              <button class="preset-pill" data-val="slow" onclick="setPreset(this)">Slow</button>
              <button class="preset-pill" data-val="veryslow" onclick="setPreset(this)">Very Slow</button>
            </div>
          </div>

          <!-- Resolution -->
          <div class="setting-group">
            <label>Resolution</label>
            <select id="set-resolution">
              <option value="auto">Original</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
            </select>
          </div>

          <!-- Frame Rate -->
          <div class="setting-group">
            <label>Frame Rate</label>
            <select id="set-framerate">
              <option value="auto">Original</option>
              <option value="60">60 fps</option>
              <option value="30">30 fps</option>
              <option value="24">24 fps</option>
              <option value="15">15 fps</option>
            </select>
          </div>

          <!-- Audio -->
          <div class="setting-group">
            <label>Audio</label>
            <select id="set-audio-codec">
              <option value="aac">AAC</option>
              <option value="none">No Audio</option>
            </select>
          </div>

          <!-- Audio Bitrate -->
          <div class="setting-group">
            <label>Audio Bitrate</label>
            <select id="set-audio-bitrate">
              <option value="64k">64 kbps</option>
              <option value="128k" selected>128 kbps</option>
              <option value="192k">192 kbps</option>
              <option value="256k">256 kbps</option>
            </select>
          </div>
        </div>
      </div>

      <button class="compress-btn" style="margin-top: 12px" onclick="startCompress()">Compress</button>
    </div>

    <!-- State: compressing -->
    <div id="progress-state" class="progress-area" style="display:none">
      <div class="current-file" id="current-file">Preparing...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text">
        <span id="progress-count">0 / 0 videos</span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <!-- State: done -->
    <div id="done-state" class="done-area" style="display:none">
      <div class="checkmark">&#x2705;</div>
      <div class="message">Compression Complete</div>
      <div class="sub" id="done-message"></div>
      <button class="reset-btn" onclick="reset()">Compress another folder</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    let selectedFolder = null
    let videoList = []
    let currentPreset = 'medium'

    const dropZone = document.getElementById('drop-state')

    document.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation() })
    document.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation() })

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over') })
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over') })
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault()
      dropZone.classList.remove('drag-over')
      if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].path) {
        await loadFolder(e.dataTransfer.files[0].path)
      }
    })

    async function selectFolder() {
      const folder = await ipcRenderer.invoke('select-folder')
      if (folder) await loadFolder(folder)
    }

    async function loadFolder(folderPath) {
      selectedFolder = folderPath
      videoList = await ipcRenderer.invoke('scan-folder', folderPath)

      if (videoList.length === 0) {
        alert('No video files found in this folder.')
        return
      }

      const totalSize = videoList.reduce((s, v) => s + v.size, 0)
      document.getElementById('folder-name').textContent = folderPath.split('/').pop()
      document.getElementById('folder-meta').textContent =
        `${videoList.length} video${videoList.length !== 1 ? 's' : ''} · ${formatBytes(totalSize)}`

      updateSettings()
      showState('selected')
    }

    function updateSettings() {
      const encoder = document.getElementById('set-encoder').value
      const presetGroup = document.getElementById('preset-group')
      presetGroup.style.display = encoder === 'software' ? 'flex' : 'none'
      updateQuality()
    }

    function updateQuality() {
      const val = parseInt(document.getElementById('set-quality').value)
      document.getElementById('quality-value').textContent = val
      let label = ''
      if (val <= 15) label = `${val} (Near Lossless)`
      else if (val <= 20) label = `${val} (High)`
      else if (val <= 25) label = `${val} (Good)`
      else if (val <= 30) label = `${val} (Medium)`
      else if (val <= 38) label = `${val} (Low)`
      else label = `${val} (Very Low)`
      document.getElementById('quality-label').textContent = label
    }

    function setPreset(btn) {
      document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'))
      btn.classList.add('active')
      currentPreset = btn.dataset.val
    }

    function getSettings() {
      return {
        codec: document.getElementById('set-codec').value,
        encoder: document.getElementById('set-encoder').value,
        quality: parseInt(document.getElementById('set-quality').value),
        preset: currentPreset,
        resolution: document.getElementById('set-resolution').value,
        framerate: document.getElementById('set-framerate').value,
        audioCodec: document.getElementById('set-audio-codec').value,
        audioBitrate: document.getElementById('set-audio-bitrate').value,
      }
    }

    async function startCompress() {
      const settings = getSettings()

      // Check for existing files
      const duplicates = await ipcRenderer.invoke('check-duplicates', {
        inputFolder: selectedFolder,
        videos: videoList,
      })

      let overwrite = false
      if (duplicates.length > 0) {
        const names = duplicates.length <= 5
          ? duplicates.join('\n')
          : duplicates.slice(0, 5).join('\n') + `\n...and ${duplicates.length - 5} more`

        const choice = confirm(
          `${duplicates.length} file${duplicates.length !== 1 ? 's' : ''} already exist in the compressed folder:\n\n${names}\n\nOverwrite them?`
        )
        if (!choice) return
        overwrite = true
      }

      showState('progress')

      ipcRenderer.on('progress', (_event, data) => {
        const base = data.status === 'compressing' ? Math.max(0, data.current) : data.current
        const filePercent = data.status === 'compressing' ? (data.percent || 0) : 100
        const overallPercent = Math.max(0, Math.min(100, Math.round(((base * 100 + filePercent) / data.total))))

        document.getElementById('progress-bar').style.width = `${overallPercent}%`
        document.getElementById('progress-percent').textContent = `${overallPercent}%`
        document.getElementById('progress-count').textContent = `${data.current} / ${data.total} videos`

        if (data.status === 'compressing') {
          document.getElementById('current-file').textContent = `Compressing ${data.file}... ${data.percent || 0}%`
        } else if (data.status === 'done') {
          document.getElementById('current-file').textContent = `Done: ${data.file}`
        } else if (data.status === 'skipped') {
          document.getElementById('current-file').textContent = `Skipped (exists): ${data.file}`
        } else if (data.status === 'error') {
          document.getElementById('current-file').textContent = `Error: ${data.file}`
        }
      })

      const result = await ipcRenderer.invoke('compress', {
        inputFolder: selectedFolder,
        videos: videoList,
        settings,
        overwrite,
      })

      ipcRenderer.removeAllListeners('progress')
      document.getElementById('done-message').textContent =
        `${result.completed} videos compressed to "${result.outputFolder.split('/').pop()}"`
      showState('done')
    }

    function reset() {
      selectedFolder = null
      videoList = []
      document.getElementById('progress-bar').style.width = '0%'
      showState('drop')
    }

    function showState(state) {
      document.getElementById('drop-state').style.display = state === 'drop' ? 'flex' : 'none'
      document.getElementById('selected-state').style.display = state === 'selected' ? 'block' : 'none'
      document.getElementById('progress-state').style.display = state === 'progress' ? 'flex' : 'none'
      document.getElementById('done-state').style.display = state === 'done' ? 'flex' : 'none'
    }

    function formatBytes(bytes) {
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`
      return `${(bytes / 1024 / 1024 / 1024).toFixed(2)} GB`
    }

    updateSettings()
  </script>
</body>
</html>
